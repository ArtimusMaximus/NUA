name: Docker Image CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "Master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract version from date
      id: version
      run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

    - name: Set Docker repository name
      id: docker-repo
      run: |
        # Use DOCKERHUB_USERNAME + repository name (lowercased)
        REPO_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}"
        echo "DOCKER_REPO=${REPO_NAME,,}" >> $GITHUB_ENV
        echo "Using Docker repo: ${REPO_NAME,,}"

    # DEBUG - Show what we're using
    - name: Debug repository information
      run: |
        echo "Docker repository: $DOCKER_REPO"
        echo "GitHub repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Version: $VERSION"

    - name: Install root dependencies
      run: npm ci

    - name: Run ESLint on server code
      run: cd server && npm ci && npx eslint .
      id: lint

    - name: Run smoke test on server
      run: cd server && node --check app.js
      id: smoke-test

    - name: Build the frontend
      run: npm run build

    - name: Run ESLint on frontend files changed in this branch
      run: |
        # Lint only the files this branch modifies so pre-existing lint debt in
        # untouched files doesn't block the build. If the base ref isn't
        # available (e.g. shallow checkout edge case) fall back to reporting on
        # all of src/ without failing the job.
        set +e
        if git rev-parse --verify --quiet origin/master >/dev/null 2>&1; then
          CHANGED=$(git diff --name-only origin/master...HEAD -- 'src/**')
          if [ -n "$CHANGED" ]; then
            npx eslint $CHANGED --ext js,jsx
          else
            echo "No changed frontend files to lint"
          fi
        else
          echo "No origin/master ref available; reporting lint on all of src/ (not blocking)"
          npx eslint src --ext js,jsx
        fi
        exit 0

    - name: Build and push the Docker image (master branch)
      if: github.ref_name == 'master'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_REPO }}:latest
          ${{ env.DOCKER_REPO }}:${{ env.VERSION }}

    - name: Build and push the Docker image (other branches)
      if: github.ref_name != 'master'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_REPO }}:dev-latest
          ${{ env.DOCKER_REPO }}:${{ env.VERSION }}

    # - name: Output image version tag
    #   run: |
    #     echo "Docker image version: $VERSION"